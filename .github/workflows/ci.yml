name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint --from base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x # engines ">=22.18" — scripts/*.ts를 Node 타입 제거로 바로 돌린다
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 실브라우저 층(adr-024)의 Chromium — 브라우저 파일은 Playwright 버전별로 캐시하고, 시스템 라이브러리는 매번 깐다
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm verify # typecheck · lint · lint:css · format:check · test · test:e2e · docs:check — package.json과 같은 한 줄
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
        if: github.event_name == 'pull_request'
      - run: pnpm exec openspec validate --archived --strict
        env:
          OPENSPEC_TELEMETRY: "0"
